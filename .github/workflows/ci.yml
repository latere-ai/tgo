name: ci

# Tier 1 from specs/010-conformance.md section 4: everything that needs no
# device and no weights. It runs on every push, because each of these gates
# rots silently.
#
# Tier 2 is ci-metal.yml. A job that promises a backend and finds no device is
# a failure rather than a skip, so it cannot share a matrix with jobs that
# promise only the CPU.
#
# Tier 3 -- real weights -- is never here. specs/000-decisions.md decision 8:
# the smallest Qwen3 is over a gigabyte, and a CI that downloads one is a CI
# nobody runs locally.
#
# The gates themselves live in latere-ai/ci (which orders them) and
# latere.ai/x/ci-gate (which decides what each asserts), and are reached
# through this repo's Makefile. Every one of them runs locally: `make cover`,
# `make deps`, `make spec-lint` and the rest need nothing but this checkout.
#
# Windows is in windows.yml rather than in the matrix here, because the
# runner image ships no GNU make and the contract is make targets.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
