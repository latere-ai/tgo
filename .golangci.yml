      # Disabled in .lateregate.yaml, which the go fix gate reads too, so both
      # run the same set.
      disable:
        - newexpr
        - errorsastype

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/latere-ai/tgo
