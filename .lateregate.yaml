# The per-push gate configuration for tgo. Every check runs from
# latere.ai/x/ci-gate, pinned in go.mod, so each one runs the same on a laptop
# as it does on a runner.

cover:
  trim_prefix: github.com/latere-ai/tgo/
  exempt:
    # A short list on purpose. Every entry is a promise that the package is
    # thin enough that its coverage would measure the test harness rather than
    # the code. The value is the reason; lateregate rejects an empty one.
    cmd/tgo: >-
      argument parsing and process wiring; the packages under it carry the
      logic
    internal/conformance: >-
      device-open and Metal-present branches, unreachable without a Metal
      device; the tier decisions they act on are pure and fully covered.
      specs/010-conformance.md section 4. ci-metal.yml has a machine with
      Metal; this gate does not, and a mock device here would cover the
      statements and prove nothing about accel

race:
  # A budget, not a guard against a hung test. The root package runs a
  # synthetic model's forward pass on the CPU and the race detector costs
  # roughly an order of magnitude on exactly that arithmetic: 2547s of CPU as
  # of 2026-08-27, with a shared block pool exercised by real forward passes
  # in two packages. CONTRIBUTING tracks that as a 3500s budget rather than a
  # line to move again; past it the answer is a cheaper suite.
  timeout: 45m

hermetic:
  # Nothing besides the toolchain. tgo's tests reach no system binary, and the
  # empty list is what keeps that true.
  allow: []

spec:
  # `archived` is the terminal status and the only one that leaves the queue.
  # `complete` means nothing in the spec's own scope is open, and those stay at
  # the root: 011-sequencing links them as the record of what happened.
  status: [drafted, validated, dispatched, implemented, complete, blocked, deferred, record, archived]
  tables: true
  vocabulary:
    layer: [load, text, graph, engine, api, all]
  status_requires:
    blocked:
      field: blocked_on
      match: 'accel#[0-9]+|/issues/[0-9]+|`[^`]+`'
      hint: 'want an "accel#N" reference or a `backticked` upstream name; a bare file path is a belief about whose problem it is, not a record anyone can act on'
  require_section: ["Decision record"]
  require_section_by_status:
    implemented: ["Outcome"]
    complete: ["Outcome"]
  section_exempt: [000-decisions.md, 011-sequencing.md]
  scoped_ids: '\| (\d{3})-D(\d+) \|'
  # `complete` means the outcome is recorded in 011, which is a claim about
  # another file that the section rule cannot see.
  status_linked_from:
    complete: 011-sequencing.md
  # The Outcome section's "Not built." paragraph is what makes `implemented`
  # and `complete` distinguishable. Checking one direction only would let a
  # finished spec sit at `implemented`, which hides that it is finished.
  status_marker:
    pattern: '\*\*Not built\.?\*\*:?\s+(\S+)'
    required: [implemented, complete]
    expect:
      complete: '^Nothing'
    reject:
      implemented: '^Nothing'
  register:
    # specs/010-conformance.md section 2 numbers the conformance rows, and the
    # rest of the tree cites them. A gap means a row was deleted and every
    # number after it now means something else; a dangling citation is the same
    # drift one level up. Neither is visible in review.
    file: 010-conformance.md
    define: '(?m)^\| \*{0,2}(C\d+)\*{0,2} \|'
    cite: '010 (C\d+)|\b(C\d+)\]\(010-conformance\.md\)'
    sequential: true
    prefix: C
  archive:
    dir: .archive
    statuses: [archived]

depcheck:
  platforms:
    - linux/amd64
    - linux/arm64
    - linux/arm
    - darwin/amd64
    - darwin/arm64
    - windows/amd64
    - windows/arm64
    - freebsd/amd64
    - openbsd/amd64
    - netbsd/amd64
  packages:
    github.com/latere-ai/tgo/server:
      decision: 009-D14
      allow:
        golang.design/x/accel: the compute layer; 000 D1 makes every package here reach it
        golang.org/x/text: Unicode normalisation for the tokenizer, 002-D10
        latere.ai/x/pkg/llmdialect: the three wire dialects, 009-D10; this is the one 009-D14 exists to watch
        github.com/ebitengine/purego: accel's cgo-free dynamic loading of Metal, reached through accel on darwin only
    github.com/latere-ai/tgo/tokenizer:
      decision: 002-D10
      allow:
        golang.org/x/text: Unicode normalisation, 002-D10; pure Go, so 000 D2 holds

license:
  # The identifier every source file carries and the holder it names. There
  # is no default: this is the decision the gate checks the tree against.
  # `go tool lateregate license -w` writes the notice where it is missing.
  spdx: Apache-2.0
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile]
